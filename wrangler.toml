# Cloudflare Pages project. The site is built with `npm run build` into dist/; the Functions in
# functions/ (the twins of api/ on Vercel) are bundled by Cloudflare. Secrets such as
# SUPABASE_SERVICE_ROLE_KEY are set in the Pages project's settings, never here.
name = "greyowlstracker"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Plain settings the Functions read (public, so kept here rather than as secrets). With this file
# in the repo, Cloudflare takes plain variables from here instead of the dashboard.
[vars]
# Send each saved attendance entry to the team's Google Form (src/lib/attendanceGoogleForm.ts).
ATTENDANCE_GOOGLE_FORM = "on"
